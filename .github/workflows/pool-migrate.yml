name: Oracle Pool - Migrate funds

# Разовая операция: перевести призовые с прежнего операторского кошелька на
# контракт пула. Мнемоника остаётся в секретах - скрипт только подписывает
# перевод и печатает адрес отправителя для сверки перед отправкой.
on:
  workflow_dispatch:
    inputs:
      pool:
        description: 'Which pool'
        required: true
        default: 'weekly'
        type: choice
        options: [daily, weekly]
      amount:
        description: 'Amount in uluna (1 LUNC = 1000000)'
        required: true
        default: '295000000000'
      confirm:
        description: 'Type SEND to confirm'
        required: true
        default: ''

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Guard
        if: ${{ github.event.inputs.confirm != 'SEND' }}
        run: echo "confirm != SEND, aborting" && exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install @cosmjs/proto-signing@0.32.4 @cosmjs/stargate@0.32.4 @cosmjs/crypto@0.32.4

      - name: Write script
        run: |
          cat > send.mjs <<'EOF'
          import { DirectSecp256k1HdWallet } from '@cosmjs/proto-signing';
          import { SigningStargateClient } from '@cosmjs/stargate';
          import { stringToPath } from '@cosmjs/crypto';

          const RPC = 'https://terra-classic-rpc.publicnode.com';
          const wallet = await DirectSecp256k1HdWallet.fromMnemonic(process.env.MNEMONIC, {
            prefix: 'terra',
            hdPaths: [stringToPath("m/44'/330'/0'/0/0")],
          });
          const [acc] = await wallet.getAccounts();
          console.log('from   ', acc.address);
          console.log('expect ', process.env.EXPECT);
          if (acc.address !== process.env.EXPECT) {
            throw new Error('mnemonic does not match the expected wallet - nothing sent');
          }
          console.log('to     ', process.env.TO);
          console.log('amount ', process.env.AMOUNT, 'uluna');

          const client = await SigningStargateClient.connectWithSigner(RPC, wallet);
          const bal = await client.getBalance(acc.address, 'uluna');
          console.log('balance', bal.amount, 'uluna');
          if (BigInt(bal.amount) <= BigInt(process.env.AMOUNT)) {
            throw new Error('amount is not below the balance - leave room for tax and fee');
          }

          const gas = 300000;
          const fee = {
            amount: [{ denom: 'uluna', amount: String(Math.ceil(gas * 28.325)) }],
            gas: String(gas),
          };
          const res = await client.sendTokens(
            acc.address,
            process.env.TO,
            [{ denom: 'uluna', amount: process.env.AMOUNT }],
            fee,
            'oracle-pool: migrate prize funds'
          );
          console.log('tx', res.transactionHash, 'code', res.code);
          if (res.code !== 0) process.exit(1);

          const after = await client.getBalance(process.env.TO, 'uluna');
          console.log('pool balance now', after.amount, 'uluna');
          EOF

      - name: Send
        env:
          MNEMONIC: ${{ github.event.inputs.pool == 'weekly' && secrets.OPERATOR_MNEMONIC_WEEKLY || secrets.OPERATOR_MNEMONIC_DAILY }}
          EXPECT: ${{ github.event.inputs.pool == 'weekly' && 'terra1p5l6q95kfl3hes7edy76tywav9f79n6xlkz6qz' || 'terra1amp68zg7vph3nq84ummnfma4dz753ezxfqa9px' }}
          TO: ${{ github.event.inputs.pool == 'weekly' && 'terra19w39c3qz6kc756hap92x374reptah9kp5825f5c67hmquy383r5qd7dmd8' || 'terra1d9ga3dzhg63v6rmm8ahts55ekjpwlm6dusw5cwhpt60s6t0actqqsul6tm' }}
          AMOUNT: ${{ github.event.inputs.amount }}
        run: node send.mjs
